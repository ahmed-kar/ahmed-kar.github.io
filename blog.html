<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Ahmed Karim</title>
  <meta name="description" content="Blog posts by Ahmed Karim." />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var theme = saved || (prefersDark ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {}
    })();
  </script>

  <style>
    .blog-hero {
      padding: 36px 0 18px;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 28px;
    }
    .blog-hero .crumbs {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--text-faint);
      margin-bottom: 10px;
    }
    .blog-hero .crumbs a { color: var(--text-muted); }
    .blog-hero .crumbs a:hover { color: var(--accent); }
    .blog-hero h1 {
      font-family: var(--mono);
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--text);
    }
    .blog-empty {
      font-family: var(--mono);
      font-size: 0.86rem;
      color: var(--text-muted);
      padding: 28px 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">
    <span class="theme-icon-light" aria-hidden="true">☀</span>
    <span class="theme-icon-dark" aria-hidden="true">☾</span>
  </button>

  <main>

    <section class="blog-hero">
      <div class="crumbs"><a href="index.html">← Home</a></div>
      <h1>Blog</h1>
    </section>

    <!-- Posts go here, newest first. -->
    <p class="blog-empty">No posts yet.</p>

  </main>

  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      btn.addEventListener('click', function () {
        var current = document.documentElement.getAttribute('data-theme') || 'light';
        var next = current === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
